<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <section class="controles">

        <input id="buscador" type="search" placeholder="Buscar...">

        <button id="ordenNombre">Ordenar A-Z</button>

        <button id="ordenNumero">Ordenar por índice</button>

        <button id="ordenFecha">Más recientes primero</button>

    </section>

    <section id="formulario">

        <h2>Añadir un videojuego</h2>

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" placeholder="Nombre del videojuego">

        <label for="genero">Género:</label>
        <input type="text" id="genero" placeholder="Ejemplo: Aventura">

        <label for="plataforma">Plataforma:</label>
        <input type="text" id="plataforma" placeholder="Ejemplo: PC">

        <label for="fecha">Fecha de lanzamiento:</label>
        <input type="date" id="fecha">

        <label for="disponible">
            <input type="checkbox" id="disponible" checked>
            Disponible
        </label>

        <button id="anadirJuego" type="button">
            Añadir videojuego
        </button>

    </section>

    <header>

        <h1>Mi biblioteca de videojuegos</h1>

        <p id="resumen"></p>

        <p id="estadisticas"></p>

    </header>

    <main id="listado"></main>

    <script src="js/app.js" defer></script>

</body>
</html>
