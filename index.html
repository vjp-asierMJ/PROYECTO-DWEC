<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Mi biblioteca de videojuegos</h1>
        <p id="resumen" aria-live="polite"></p>
        <p id="estadisticas"></p>
    </header>

    <section class="controles" aria-label="Búsqueda y ordenación">
        <label class="solo-lectores" for="buscador">Buscar videojuegos</label>
        <input id="buscador" type="search" placeholder="Buscar...">
        <button id="ordenNombre" type="button">Ordenar A-Z</button>
        <button id="ordenNumero" type="button">Ordenar por índice</button>
        <button id="ordenFecha" type="button">Más recientes primero</button>
    </section>

    <section id="formulario" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Añadir un videojuego</h2>

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" placeholder="Nombre del videojuego">

        <label for="genero">Género:</label>
        <input type="text" id="genero" placeholder="Ejemplo: Aventura">

        <label for="plataforma">Plataforma:</label>
        <input type="text" id="plataforma" placeholder="Ejemplo: PC">

        <label for="fecha">Fecha de lanzamiento:</label>
        <input type="date" id="fecha">

        <label for="disponible">Disponibilidad:</label>
        <select id="disponible">
            <option value="true" selected>Disponible</option>
            <option value="false">No disponible</option>
        </select>

        <button id="anadirJuego" type="button">Añadir videojuego</button>
        <p id="mensaje" class="mensaje" aria-live="polite"></p>
    </section>

    <main id="listado" aria-label="Listado de videojuegos"></main>
</body>
</html>
